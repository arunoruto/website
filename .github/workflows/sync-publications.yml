name: Sync publications

# Re-fetches the Google Scholar profile (via SerpApi), enriched by ORCID and
# Crossref, via scripts/sync_publications.py and commits data/publications.json,
# data/publications.bib and data/scholar.json if anything changed.
# The Hugo build itself never hits these APIs live - this is the only place
# that does, on a schedule, so a flaky Scholar/ORCID/Crossref response can't
# break the site build.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

# The Monday cron and a manual dispatch can otherwise race to push to main,
# and the loser fails on a non-fast-forward.
concurrency:
  group: sync-publications
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The script declares its interpreter and dependencies inline (PEP 723),
      # so uv resolves both from the script itself - no setup-python, no
      # pip install, no lockfile to keep in sync.
      # setup-uv publishes no floating major tags since v8 (supply-chain
      # hardening) - "@v9" does not exist and fails the job before it starts.
      # Pin the full version; Dependabot's github-actions updates bump it.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Run sync script
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: uv run scripts/sync_publications.py

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          # Stage first: a plain `git diff` would not see a newly created file.
          git add data/publications.json data/publications.bib data/scholar.json
          if git diff --cached --quiet; then
            echo "No publication changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(publications): sync from Scholar/ORCID/Crossref"
          # Land on top of anything pushed since checkout.
          git pull --rebase --autostash
          git push
